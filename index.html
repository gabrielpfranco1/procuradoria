<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4338ca">
<link rel="icon" href="icon-192.png">
<title>Método Procuradoria</title>
<style>
:root{--bg:#f4f5f9;--card:#fff;--text:#1c2033;--muted:#6b7190;--border:#e3e6f0;--primary:#4338ca;--primary-soft:#e8e7fb;--green:#16a34a;--yellow:#d97706;--red:#dc2626;--blue:#2563eb;--side:#171a2e;--side-text:#aeb4d6;--shadow:0 1px 3px rgba(20,24,60,.08),0 4px 14px rgba(20,24,60,.05)}
:root[data-theme=dark]{--bg:#0f111c;--card:#1a1d2e;--text:#e8eaf6;--muted:#8d93b5;--border:#2a2e47;--primary:#818cf8;--primary-soft:#26294a;--side:#0a0c15;--shadow:0 1px 3px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside.side{background:var(--side);color:var(--side-text);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{color:#fff;font-weight:700;font-size:16px;padding:6px 10px 18px;display:flex;gap:8px;align-items:center}
.brand small{display:block;font-weight:400;color:var(--side-text);font-size:11px}
#nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--side-text);margin-bottom:2px;user-select:none}
#nav a:hover{background:rgba(255,255,255,.06);color:#fff}
#nav a.on{background:var(--primary);color:#fff}
#nav .nb{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.content{min-width:0}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{font-size:18px;margin:0;flex:1}
main{padding:22px 24px 60px;max-width:1280px}
.btn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:7px 13px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.danger{color:var(--red)}
.btn.ghost{background:transparent}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.g{background:var(--green);border-color:var(--green);color:#fff}
.btn.y{background:var(--yellow);border-color:var(--yellow);color:#fff}
.btn.r{background:var(--red);border-color:var(--red);color:#fff}
.btn.sel{outline:3px solid var(--primary);outline-offset:1px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:14px}
.card h3 small{color:var(--muted);font-weight:400}
.grid{display:grid;gap:14px;margin-bottom:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g21{grid-template-columns:2fr 1fr}
@media(max-width:1000px){.g4,.g3,.g21{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.shell{grid-template-columns:1fr}aside.side{position:static;height:auto}#nav{display:flex;flex-wrap:wrap}.g2,.g3,.g4,.g21{grid-template-columns:1fr}main{padding:14px}}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:28px;font-weight:700;margin:4px 0 2px}
.kpi .s{font-size:12px;color:var(--muted)}
.good{color:var(--green)}.warn{color:var(--yellow)}.bad{color:var(--red)}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:var(--primary-soft);color:var(--primary);white-space:nowrap}
.badge.g{background:#dcfce7;color:#15803d}.badge.y{background:#fef3c7;color:#b45309}.badge.r{background:#fee2e2;color:#b91c1c}.badge.b{background:#dbeafe;color:#1d4ed8}.badge.m{background:var(--border);color:var(--muted)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px;border-bottom:1px solid var(--border)}
td{padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
.tw{overflow:auto}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:7px 10px;width:100%}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:-1px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 3px;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1;min-width:130px}
.row>.auto{flex:none;min-width:0}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters select,.filters input{width:auto;min-width:150px}
.muted{color:var(--muted)}.small{font-size:12px}
.bar{height:10px;background:var(--border);border-radius:99px;position:relative;overflow:visible}
.bar i{display:block;height:100%;border-radius:99px;background:var(--primary)}
.bar b{position:absolute;top:-3px;width:2px;height:16px;background:var(--text);opacity:.6}
.brow{display:grid;grid-template-columns:150px 1fr 56px;gap:10px;align-items:center;margin:9px 0}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:12px}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs a{padding:4px 11px;border-radius:99px;border:1px solid var(--border);cursor:pointer;font-size:12px}
.tabs a.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.check{display:flex;gap:9px;align-items:center;padding:6px 0;cursor:pointer}
.check input{width:18px;height:18px}
#modal{position:fixed;inset:0;background:rgba(10,12,30,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:30px 14px;overflow:auto}
#modal.on{display:flex}
.mbox{background:var(--card);border-radius:16px;width:100%;max-width:640px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mbox.wide{max-width:900px}
.mbox h2{margin:0 0 6px;font-size:17px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.cedit{border:1px solid var(--border);border-radius:12px;padding:12px;margin:10px 0;background:var(--bg)}
.cedit .h{display:flex;gap:8px;align-items:center;justify-content:space-between}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;z-index:99;display:none}
#exam{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;flex-direction:column}
#exam.on{display:flex}
.ex-top{background:#111322;color:#fff;padding:12px 22px;display:flex;gap:16px;align-items:center}
.ex-top b{flex:1}
#exTimer{font-variant-numeric:tabular-nums;font-size:18px;font-weight:700;background:#262a48;padding:4px 12px;border-radius:8px}
.ex-body{flex:1;display:grid;grid-template-columns:200px 1fr;min-height:0}
.ex-nav{background:var(--card);border-right:1px solid var(--border);padding:14px;overflow:auto}
.ex-nav .grid2{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.qn{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;border:2px solid var(--border);cursor:pointer;font-weight:600;font-size:13px}
.qn.done{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.qn.cur{outline:3px solid var(--primary)}
.qn.flag{border-color:var(--yellow)}
.qn.mg{background:var(--green);color:#fff;border-color:var(--green)}.qn.my{background:var(--yellow);color:#fff;border-color:var(--yellow)}.qn.mr{background:var(--red);color:#fff;border-color:var(--red)}
.ex-main{padding:24px 34px;overflow:auto}
.ex-q{font-size:18px;font-weight:600;white-space:pre-wrap;margin:10px 0 16px;line-height:1.5}
.ex-main textarea{min-height:300px;font-size:15px;line-height:1.6}
.pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;min-height:90px}
@media(max-width:760px){.ex-body{grid-template-columns:1fr}.ex-nav{border-right:0;border-bottom:1px solid var(--border)}.ex-main{padding:16px}}
.banner{background:#fef3c7;color:#92400e;border-radius:12px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center}
.hero{background:linear-gradient(135deg,#4338ca,#7c3aed);color:#fff;border-radius:16px;padding:22px;margin-bottom:14px}
.hero h2{margin:0 0 6px}
.method pre{white-space:pre-wrap;font-family:inherit;margin:0}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-dow{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:center;padding:2px 0}
.cal-cell{min-height:96px;border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:5px 6px;cursor:pointer;overflow:hidden}
.cal-cell:hover{border-color:var(--primary)}
.cal-cell.out{opacity:.45}
.cal-cell.today{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft);background:var(--card)}
.cal-cell.sel{outline:2px solid var(--primary);outline-offset:-1px}
.cal-n{font-weight:700;font-size:12px;margin-bottom:2px}
.chip{display:inline-block;font-size:11px;line-height:16px;border-radius:6px;padding:0 5px;margin:1px 2px 0 0;background:var(--primary-soft);color:var(--primary);white-space:nowrap}
.chip.r{background:#fee2e2;color:#b91c1c}.chip.g{background:#dcfce7;color:#15803d}.chip.y{background:#fef3c7;color:#b45309}.chip.b{background:#dbeafe;color:#1d4ed8}
.cal-ev{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--primary);color:#fff;border-radius:5px;padding:0 5px;margin-top:2px}
.cal-ev.done{opacity:.5;text-decoration:line-through}
@media(max-width:760px){.cal-cell{min-height:64px;padding:3px}.cal-grid{gap:3px}.chip{font-size:10px;padding:0 3px}}
#drBanner:not(:empty){padding:14px 24px 0;max-width:1280px}@media(max-width:760px){#drBanner:not(:empty){padding:12px 14px 0}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">⚖️ <div>Método Procuradoria<small>Sistema de estudo local</small></div></div>
    <nav id="nav"></nav>
  </aside>
  <div class="content">
    <div class="top"><h1 id="title"></h1><span id="timerChip"></span><span id="syncChip"></span><button class="btn" data-act="quickLog">+ Questões</button><button class="btn primary" data-act="newTopic">+ Assunto</button><button class="btn ghost" data-act="theme" title="Alternar tema">🌓</button></div>
    <div id="drBanner"></div>
    <main id="main"></main>
  </div>
</div>
<div id="modal"></div>
<div id="exam"></div>
<div id="toast"></div>

<script>
'use strict';
/* ============ utilidades ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmtISO=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>fmtISO(new Date());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmtISO(d)};
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const br=s=>s?s.split('-').reverse().join('/'):'—';
const brShort=s=>s?s.slice(8)+'/'+s.slice(5,7):'';
const pct=(a,t)=>t?Math.round(a/t*1000)/10:null;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmtH=min=>{const h=Math.floor(min/60),m=Math.round(min%60);return h+'h'+pad(m)};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)};

/* ============ estado ============ */
const KEY='metodo-procuradoria-v1';
const NIVEIS=[15,30,45,60,90,180];
function fresh(){return{v:1,settings:{stage:1,meta:85,amostra:100,horasSemana:25,tema:'auto',nome:''},
 disciplinas:[['Constitucional',1],['Administrativo',1],['Tributário',1],['Processo Civil',1],['Financeiro',1],['Civil',2],['Trabalho',2],['Processo do Trabalho',2],['Ambiental',3],['Previdenciário',3],['Urbanístico',3]].map(([n,e])=>({n,e})),
 topics:[],logs:[],erros:[],sessoes:[],simulados:[],treinos:[],leituras:[],eventos:[],checks:{},timer:null,exam:null,lastBackup:''}}
function migrate(o){const f=fresh();const s=Object.assign(f,o);s.settings=Object.assign(f.settings,o.settings||{});return s}
let S=(()=>{try{const r=localStorage.getItem(KEY);if(r)return migrate(JSON.parse(r))}catch(e){}return fresh()})();
let saveFail=false;
function save(){S.savedAt=Date.now();track();try{localStorage.setItem(KEY,JSON.stringify(S));saveFail=false}catch(e){if(!saveFail)toast('⚠ Não consegui salvar no navegador. Exporte um backup!');saveFail=true}fsSchedule();driveSchedule()}
const UI={view:'dashboard',f:{},cal:{m:today().slice(0,7),sel:today()}};
const F=k=>UI.f[k]||'';
const escOf=d=>{const x=S.disciplinas.find(z=>z.n===d);return x?x.e:0};
const discNames=()=>S.disciplinas.map(d=>d.n);
const nomeEsc={1:'Núcleo duro',2:'2º escalão',3:'3º escalão'};

/* ============ regras do método ============ */
function nextState(c,m){
  const cur=c.nivel;let v=c.verdes||0,nv;
  if(m==='x'){nv=15;v=0}
  else if(cur===15){if(m==='g'){nv=60;v=1}else if(m==='y'){nv=45;v=0}else{nv=15;v=0}}
  else if(m==='g'){v++;nv=(v>=3||cur===180)?180:90}
  else if(m==='y'){nv=60;v=0}
  else{nv=30;v=0}
  return{nv,v,prox:addDays(today(),nv)};
}
function applyMark(c,m){const n=nextState(c,m);(c.hist=c.hist||[]).push({d:today(),r:m,de:c.nivel,para:n.nv});c.nivel=n.nv;c.verdes=n.v;c.ultima=today();c.prox=n.prox}
function newCard(o={}){return Object.assign({id:uid(),tipo:'conhecimento',q:'',a:'',nivel:30,prox:'',ultima:'',verdes:0,hist:[],ativo:true},o)}
function prio(x){const o=Math.max(0,diffDays(today(),x.c.prox));const e=escOf(x.t.disc);return o*2+(e===1?3:e===2?2:1)+(x.c.nivel<=30?2:0)+(x.c.nivel===15?4:0)}
function allCards(){const r=[];S.topics.forEach(t=>{if(t.status==='estudado')t.cards.forEach(c=>{if(c.ativo!==false)r.push({t,c})})});return r}
function dueCards(date){date=date||today();return allCards().filter(x=>x.c.prox&&x.c.prox<=date).sort((a,b)=>prio(b)-prio(a))}
function findCard(id){for(const t of S.topics){const c=t.cards.find(x=>x.id===id);if(c)return{t,c}}return null}
const consolidado=c=>c.nivel===180&&(c.verdes||0)>=3;

/* ============ estatísticas ============ */
function logsFiltered(f={}){return S.logs.filter(l=>(!f.esc||escOf(l.disc)===f.esc)&&(!f.disc||l.disc===f.disc)).sort((a,b)=>a.data.localeCompare(b.data)||(a.ts||0)-(b.ts||0))}
function rollingEnd(list,end,N){let t=0,a=0;for(let i=end;i>=0;i--){t+=list[i].total;a+=list[i].acertos;if(t>=N)break}return{tot:t,ac:a,p:pct(a,t)}}
const rolling=(list,N)=>list.length?rollingEnd(list,list.length-1,N):{tot:0,ac:0,p:null};
function evolSeries(f,N){const list=logsFiltered(f);const byDay={};list.forEach((l,i)=>{byDay[l.data]=rollingEnd(list,i,N)});return Object.entries(byDay).map(([x,r])=>({x,y:r.p,tot:r.tot}))}
function stageStatus(){const N=S.settings.amostra,m=S.settings.meta;const r1=rolling(logsFiltered({esc:1}),N),r2=rolling(logsFiltered({esc:2}),N),r3=rolling(logsFiltered({esc:3}),N),all=rolling(logsFiltered({}),N);
  const ok=r=>r.p!=null&&r.p>=m&&r.tot>=N;const st=S.settings.stage;
  let ready=false,txt='';
  if(st===1){ready=ok(r1);txt='Meta para avançar ao Estágio 2: '+m+'% no núcleo duro em ≥'+N+' questões.'}
  else if(st===2){ready=ok(r2)&&ok(r1);txt='Meta para avançar ao Estágio 3: '+m+'% no 2º escalão + manutenção de '+m+'% no núcleo.'}
  else{ready=ok(all);txt='Meta: '+m+'% considerando os três escalões.'}
  return{r1,r2,r3,all,ready,txt,st}}
function sumMin(from,to){return S.sessoes.filter(s=>s.data>=from&&s.data<=to).reduce((a,s)=>a+s.min,0)}
function activityDates(){const d=new Set();S.sessoes.forEach(s=>d.add(s.data));S.logs.forEach(s=>d.add(s.data));S.erros.forEach(s=>d.add(s.data));S.topics.forEach(t=>{if(t.estudo)d.add(t.estudo);t.cards.forEach(c=>(c.hist||[]).forEach(h=>d.add(h.d)))});return d}
function streak(){const d=activityDates();let day=today();if(!d.has(day))day=addDays(day,-1);let n=0;while(d.has(day)){n++;day=addDays(day,-1)}return n}
const cls=p=>p==null?'':p>=S.settings.meta?'good':p>=S.settings.meta-10?'warn':'bad';

/* ============ gráficos (SVG sem dependências) ============ */
function emptyBox(t){return'<div class="empty">'+esc(t)+'</div>'}
function lineChart(series,o={}){
  series=series.filter(s=>s.pts.length);if(!series.length)return emptyBox('Sem dados ainda — registre questões para ver a evolução.');
  const W=720,H=o.h||240,L=36,R=14,T=12,B=26;
  const xs=[...new Set(series.flatMap(s=>s.pts.map(p=>p.x)))].sort();
  const t0=parse(xs[0]).getTime(),t1=parse(xs[xs.length-1]).getTime();
  const X=x=>xs.length===1||t1===t0?L+(W-L-R)/2:L+(parse(x).getTime()-t0)/(t1-t0)*(W-L-R);
  const Y=y=>T+(1-y/100)*(H-T-B);
  let g='';[0,20,40,60,80,100].forEach(v=>{g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--border)"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'</text>'});
  if(o.meta!=null)g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(o.meta)+'" y2="'+Y(o.meta)+'" stroke="var(--red)" stroke-dasharray="5 4"/><text x="'+(W-R)+'" y="'+(Y(o.meta)-5)+'" text-anchor="end" style="fill:var(--red)">meta '+o.meta+'%</text>';
  const lab=[xs[0],xs[Math.floor(xs.length/2)],xs[xs.length-1]];[...new Set(lab)].forEach(x=>{g+='<text x="'+X(x)+'" y="'+(H-6)+'" text-anchor="middle">'+brShort(x)+'</text>'});
  series.forEach(s=>{const pts=s.pts.map(p=>X(p.x)+','+Y(p.y)).join(' ');g+='<polyline fill="none" stroke="'+s.color+'" stroke-width="2.4" '+(s.dash?'stroke-dasharray="6 4"':'')+' points="'+pts+'"/>';s.pts.forEach(p=>{g+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="3.4" fill="'+s.color+'"><title>'+esc(s.name)+' · '+br(p.x)+' · '+p.y+'%'+(p.tot?' ('+p.tot+' q.)':'')+'</title></circle>'})});
  const leg='<div class="legend">'+series.map(s=>'<span><i style="background:'+s.color+'"></i>'+esc(s.name)+'</span>').join('')+'</div>';
  return'<svg class="chart" viewBox="0 0 '+W+' '+H+'">'+g+'</svg>'+leg;
}
function barChart(items,o={}){
  if(!items.length)return emptyBox('Sem dados.');
  const W=720,H=o.h||190,L=30,R=8,T=18,B=24;const max=Math.max(o.max||0,...items.map(i=>i.v),1);
  const bw=(W-L-R)/items.length;let g='';
  [0,.5,1].forEach(f=>{const y=T+(1-f)*(H-T-B);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--border)"/><text x="'+(L-5)+'" y="'+(y+4)+'" text-anchor="end">'+(Math.round(max*f*10)/10)+'</text>'});
  if(o.ref!=null){const y=T+(1-o.ref/max)*(H-T-B);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--red)" stroke-dasharray="5 4"/>'}
  items.forEach((it,i)=>{const h=it.v/max*(H-T-B),x=L+i*bw+bw*.18,w=bw*.64,y=T+(H-T-B)-h;g+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+Math.max(h,it.v?2:0)+'" rx="4" fill="'+(it.c||o.color||'var(--primary)')+'"><title>'+esc(it.l)+': '+(it.t||it.v)+'</title></rect>';if(it.v)g+='<text x="'+(x+w/2)+'" y="'+(y-4)+'" text-anchor="middle" style="fill:var(--text)">'+(it.t||it.v)+'</text>';if(items.length<=16||i%2===0)g+='<text x="'+(x+w/2)+'" y="'+(H-7)+'" text-anchor="middle">'+esc(it.l)+'</text>'});
  return'<svg class="chart" viewBox="0 0 '+W+' '+H+'">'+g+'</svg>';
}

function saveTopic(form){
  const fd=new FormData(form);const id=fd.get('id');

  let t=id?S.topics.find(x=>x.id===id):null;const isNew=!t;if(isNew)t={id:uid(),cards:[],criado:today()};
  const old=t.status;
  t.disc=fd.get('disc');t.assunto=assunto;t.status=fd.get('status');t.previsto=fd.get('previsto')||'';t.estudo=fd.get('estudo')||'';t.notas=fd.get('notas')||'';
  if(t.status==='estudado'){if(!t.estudo)t.estudo=today();if(old!=='estudado'){t.d2Date=addDays(t.estudo,2);t.d2Done=false}}
  const oldCards=t.cards;const cards=[];
  form.querySelectorAll('.cedit').forEach(el=>{const q=el.querySelector('.cq').value.trim(),a=el.querySelector('.ca').value.trim();if(!q&&!a)return;
    const prev=oldCards.find(x=>x.id===el.dataset.id)||newCard({id:el.dataset.id});
    prev.tipo=el.querySelector('.ctipo').value;prev.q=q;prev.a=a;prev.nivel=Number(el.querySelector('.cniv').value)||30;prev.prox=el.querySelector('.cprox').value||'';
    if(t.status==='estudado'&&!prev.prox)prev.prox=addDays(t.estudo,prev.nivel);
    if(t.status!=='estudado'&&!(prev.hist&&prev.hist.length))prev.prox='';
    cards.push(prev)});
  t.cards=cards;if(isNew)S.topics.push(t);save();closeModal();render();toast('Assunto salvo');
}
function parseBulk(txt){const out=[];let cur=null,mode='';txt.split('\n').forEach(l=>{if(/^\s*P\s*:/i.test(l)){cur={q:l.replace(/^\s*P\s*:/i,'').trim(),a:''};out.push(cur);mode='q'}else if(/^\s*R\s*:/i.test(l)&&cur){cur.a=l.replace(/^\s*R\s*:/i,'').trim();mode='a'}else if(cur){if(mode==='a')cur.a+='\n'+l;else cur.q+='\n'+l}});out.forEach(o=>{o.q=o.q.trim();o.a=o.a.trim()});return out.filter(o=>o.q)}

function vMetodo(){return`<div class="card method"><h3>Método Procuradoria — resumo de uma página</h3><pre>CONSTRUÇÃO (D0)
Estudar → fechar material → explicar → perguntar como examinador → responder → conferir/corrigir → criar AR30

D+2   Questões objetivas do assunto
D+3   Autópsia dos erros (nunca no mesmo momento do erro)

REVISÃO (a data conta a partir da revisão feita)
AR30:   🟢 → AR90   🟡 → AR60   🔴 → AR30
Falha total de recuperação (“não faço ideia”) → AR15
AR15:   🟢 → AR60   🟡 → AR45   🔴 → AR15
3 verdes consecutivos → AR180 (conhecimento consolidado, mantido no sistema)

SEMPRE
Questões + caderno de erros. Respostas com regra + fundamento legal + jurisprudência + exceção + aplicação.

PROGRESSÃO (média móvel das últimas 100–150 questões)
85% núcleo duro → estágio 2
85% 2º escalão + manutenção do núcleo → estágio 3
85% nos três escalões → manutenção + concursos

TRÊS REGRAS
1. Nunca criar revisão nova sem registrar a próxima data.
2. Nunca fazer revisão sem classificar o resultado.
3. Nunca deixar um erro sem descobrir a premissa que o produziu.</pre></div>`}

const VIEWS={dashboard:{t:'Dashboard',i:'📊',r:vDashboard},hoje:{t:'Fila do dia',i:'🎯',r:vHoje},calendario:{t:'Calendário',i:'🗓️',r:vCalendario},revisao:{t:'Revisão (prova)',i:'📝',r:vRevisao},conteudos:{t:'Conteúdos',i:'📚',r:vConteudos},leituras:{t:'Leituras',i:'📜',r:vLeituras},desempenho:{t:'Desempenho',i:'📈',r:vDesempenho},simulados:{t:'Simulados',i:'🏁',r:vSimulados},erros:{t:'Caderno de erros',i:'🧠',r:vErros},horas:{t:'Horas',i:'⏱️',r:vHoras},fase2:{t:'Segunda fase',i:'✍️',r:vFase2},metodo:{t:'Guia do método',i:'📖',r:vMetodo},config:{t:'Configurações',i:'⚙️',r:vConfig}};

/* ============ prova de revisão ============ */
function startExam(ids,aplicar){
  if(!ids.length){toast('Nenhuma pergunta disponível');return}
  if(S.exam&&!confirm('Há uma prova em andamento. Descartá-la e iniciar outra?'))return;
  S.exam={ids,idx:0,resp:{},flag:{},marks:{},fase:'prova',inicio:Date.now(),aplicar:aplicar!==false};save();render();
}
function examIds(filter,lim){let d=dueCards();if(F('rd'))d=d.filter(x=>x.t.disc===F('rd'));if(F('re'))d=d.filter(x=>String(escOf(x.t.disc))===F('re'));if(filter)d=d.filter(filter);return d.slice(0,lim||20).map(x=>x.c.id)}
const fmtT=ms=>{const s=Math.floor(ms/1000);return pad(Math.floor(s/60))+':'+pad(s%60)};
function renderExam(){
  const el=$('#exam'),E=S.exam;
  if(!E){el.classList.remove('on');el.innerHTML='';return}
  E.ids=E.ids.filter(id=>findCard(id));if(!E.ids.length){S.exam=null;save();return renderExam()}
  E.idx=Math.min(E.idx,E.ids.length-1);el.classList.add('on');
  const n=E.ids.length,cur=findCard(E.ids[E.idx]);const prova=E.fase==='prova';
  const nav=E.ids.map((id,i)=>{let c='qn';if(prova){if((E.resp[id]||'').trim())c+=' done';if(E.flag[id])c+=' flag'}else c+=' m'+(E.marks[id]==='x'?'r':E.marks[id]||'');if(i===E.idx)c+=' cur';return'<div class="'+c+'" data-act="exGo" data-i="'+i+'">'+(i+1)+'</div>'}).join('');
  let main='<div class="small muted">Questão '+(E.idx+1)+' de '+n+' · '+esc(cur.t.disc)+' — '+esc(cur.t.assunto)+' · '+nivBadge(cur.c)+' · '+(cur.c.tipo==='procurador'?'Advogado público':'Conhecimento')+'</div><div class="ex-q">'+esc(cur.c.q)+'</div>';
  if(prova){
    main+='<textarea id="exAns" placeholder="Responda de memória, como na prova: regra → fundamento legal → jurisprudência → exceção → aplicação.">'+esc(E.resp[cur.c.id]||'')+'</textarea><div class="row" style="margin-top:12px"><label class="check auto" style="margin:0;color:var(--text);font-size:13px"><input type="checkbox" data-act="exFlag" '+(E.flag[cur.c.id]?'checked':'')+'> Marcar para revisar</label><span style="flex:1"></span><button class="btn auto" data-act="exPrev" '+(E.idx===0?'disabled':'')+'>← Anterior</button><button class="btn primary auto" data-act="exNext" '+(E.idx===n-1?'disabled':'')+'>Próxima →</button></div>';
  }else{
    const m=E.marks[cur.c.id];const pv=k=>{const x=nextState(cur.c,k);return'AR'+x.nv+' em '+br(x.prox)};
    main+='<div class="grid g2" style="margin-top:6px"><div><label>Sua resposta</label><div class="pre">'+(esc(E.resp[cur.c.id]||'')||'<span class="muted">(em branco)</span>')+'</div></div><div><label>Gabarito</label><div class="pre" style="border-color:var(--primary)">'+(esc(cur.c.a)||'<span class="muted">(sem resposta-modelo cadastrada)</span>')+'</div></div></div>'+
    '<label>Como foi? (a próxima data conta a partir de hoje)</label><div class="row"><button class="btn g auto '+(m==='g'?'sel':'')+'" data-act="exMark" data-m="g">🟢 Acertei → '+pv('g')+'</button><button class="btn y auto '+(m==='y'?'sel':'')+'" data-act="exMark" data-m="y">🟡 Parcial → '+pv('y')+'</button><button class="btn r auto '+(m==='r'?'sel':'')+'" data-act="exMark" data-m="r">🔴 Errei → '+pv('r')+'</button><button class="btn auto '+(m==='x'?'sel':'')+'" style="border-color:var(--red);color:var(--red)" data-act="exMark" data-m="x" title="Falha grave de recuperação: não fazia ideia de como responder">⚠ Não fazia ideia → AR15</button></div>'+
    '<div class="row" style="margin-top:14px"><button class="btn auto" data-act="exPrev" '+(E.idx===0?'disabled':'')+'>← Anterior</button><button class="btn auto" data-act="exNext" '+(E.idx===n-1?'disabled':'')+'>Próxima →</button></div>';
  }
  const done=E.ids.filter(id=>E.marks[id]).length;
  el.innerHTML='<div class="ex-top"><b>'+(prova?'📝 PROVA DE REVISÃO':'✅ CORREÇÃO')+' · '+n+' pergunta(s)'+(E.aplicar?'':' · treino livre (não altera datas)')+'</b><span class="small" style="opacity:.7">sugerido: '+n*3+' min</span><span id="exTimer">'+fmtT(Date.now()-E.inicio)+'</span>'+(prova?'<button class="btn primary" data-act="exFinish">Entregar prova</button>':'<button class="btn primary" data-act="exDone" '+(done<n?'disabled':'')+'>Concluir ('+done+'/'+n+')</button>')+'<button class="btn ghost" style="color:#fff" data-act="exCancel">Sair</button></div><div class="ex-body"><div class="ex-nav"><div class="small muted" style="margin-bottom:8px">Navegação</div><div class="grid2">'+nav+'</div>'+(prova?'<div class="small muted" style="margin-top:12px">Respondidas: '+E.ids.filter(id=>(E.resp[id]||'').trim()).length+'/'+n+'</div>':'')+'</div><div class="ex-main">'+main+'</div></div>';
  const ta=$('#exAns');if(ta&&!ta.dataset.f){ta.dataset.f=1}
}
setInterval(()=>{const E=S.exam,t=$('#exTimer');if(E&&t)t.textContent=fmtT(Date.now()-E.inicio);const r=S.timer,b=$('#bigTimer');if(r&&b)b.textContent=fmtHMS(Date.now()-r.start);const c=$('#timerChip .tc');if(r&&c)c.textContent=fmtHMS(Date.now()-r.start)},1000);
const fmtHMS=ms=>{const s=Math.floor(ms/1000);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60)};
document.addEventListener('input',e=>{if(e.target.id==='exAns'&&S.exam){const E=S.exam,id=E.ids[E.idx];E.resp[id]=e.target.value;clearTimeout(window._sv);window._sv=setTimeout(save,400);const q=document.querySelectorAll('.qn')[E.idx];if(q)q.classList.toggle('done',!!e.target.value.trim())}});

/* ============ ações ============ */
const ACT={
  nav(el,e){e&&e.preventDefault();UI.view=el.dataset.v;window.scrollTo(0,0);render()},
  theme(){const cur=document.documentElement.dataset.theme==='dark'?'light':'dark';S.settings.tema=cur;save();applyTheme()},
  closeModal(){closeModal()},
  newTopic(){openTopic()},editTopic(el){openTopic(el.dataset.id)},
  delTopic(el){if(confirm('Excluir este assunto e todas as suas perguntas?')){S.topics=S.topics.filter(t=>t.id!==el.dataset.id);save();render()}},
  addCardEdit(){$('#cardsBox').insertAdjacentHTML('beforeend',cardEditHtml(newCard()))},
  rmCard(el){el.closest('.cedit').remove()},
  gab(el,e){e.preventDefault();const ta=el.closest('.cedit').querySelector('.ca');if(!ta.value.trim())ta.value=GAB;ta.focus()},
  toggleBulk(){const b=$('#bulk');b.style.display=b.style.display==='none'?'block':'none'},
  bulkAdd(){const items=parseBulk($('#bulkTxt').value);if(!items.length){toast('Nenhuma pergunta (P:) encontrada');return}$('#cardsBox').insertAdjacentHTML('beforeend',items.map(o=>cardEditHtml(newCard({q:o.q,a:o.a}))).join(''));$('#bulkTxt').value='';toast(items.length+' pergunta(s) adicionada(s) — clique em Salvar')},
  studied(el){openTopic(el.dataset.id,{status:'estudado',estudo:today()})},
  quickLog(){openLog()},
  d2log(el){const t=S.topics.find(x=>x.id===el.dataset.id);openLog({topicId:t.id,disc:t.disc,assunto:t.assunto,origem:'Questões D+2'})},
  d2skip(el){const t=S.topics.find(x=>x.id===el.dataset.id);t.d2Done=true;save();render()},
  delLog(el){if(confirm('Excluir este registro?')){S.logs=S.logs.filter(l=>l.id!==el.dataset.id);save();render()}},
  newSim(){openSim()},addSimRow(){$('#simRows').insertAdjacentHTML('beforeend',simRow())},rmSim(el){el.closest('.simrow').remove()},
  delSim(el){if(confirm('Excluir este simulado?')){S.simulados=S.simulados.filter(s=>s.id!==el.dataset.id);S.logs=S.logs.filter(l=>l.simId!==el.dataset.id);save();render()}},
  newErro(){openErro()},erro(el){openErro(el.dataset.id)},
  delErro(el){if(confirm('Excluir este erro?')){S.erros=S.erros.filter(x=>x.id!==el.dataset.id);save();render()}},
  check(el){const T0=today();(S.checks[T0]=S.checks[T0]||{})[el.dataset.k]=el.checked;save();render()},
  dbEsc(el){UI.f.dbEsc=el.dataset.v;render()},
  timerStart(){S.timer={start:Date.now(),disc:$('#tdisc').value,tipo:$('#ttipo').value};save();render()},
  timerStop(){const r=S.timer;if(!r)return;const min=Math.max(1,Math.round((Date.now()-r.start)/60000));S.sessoes.push({id:uid(),data:today(),disc:r.disc,min,tipo:r.tipo,nota:''});S.timer=null;save();render();toast('Sessão salva: '+min+' min')},
  timerCancel(){S.timer=null;save();render()},
  delSessao(el){S.sessoes=S.sessoes.filter(s=>s.id!==el.dataset.id);save();render()},
  delTreino(el){S.treinos=S.treinos.filter(s=>s.id!==el.dataset.id);save();render()},
  discEsc(el){S.disciplinas[el.dataset.i].e=Number(el.value);save();render()},
  delDisc(el){const d=S.disciplinas[el.dataset.i];if(confirm('Remover "'+d.n+'" da lista? (assuntos e registros existentes são mantidos)')){S.disciplinas.splice(el.dataset.i,1);save();render()}},
  exportBackup(){const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='metodo-procuradoria-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();S.lastBackup=today();save();render();toast('Backup exportado')},
  loadDemo(){loadDemo()},rmDemo(){S.topics=S.topics.filter(t=>!t.demo);['logs','sessoes','erros','leituras','eventos'].forEach(k=>S[k]=S[k].filter(x=>!x.demo));save();render();toast('Exemplos removidos')},
  resetAll(){if(confirm('Apagar TODOS os dados deste navegador? Esta ação não pode ser desfeita.')&&confirm('Tem certeza? Exporte um backup antes se não tiver certeza.')){S=fresh();save();render()}},
  /* prova */
  examDue(){startExam(examIds(null,20))},
  examBuild(){startExam(examIds(null,Number($('#limIn').value)||20))},
  examTopic(el){startExam(dueCards().filter(x=>x.t.id===el.dataset.id).map(x=>x.c.id))},
  examFree(){let a=allCards();if(F('rd'))a=a.filter(x=>x.t.disc===F('rd'));if(F('re'))a=a.filter(x=>String(escOf(x.t.disc))===F('re'));const lim=Number(F('lim'))||20;a=a.map(x=>({x,r:Math.random()})).sort((p,q)=>p.r-q.r).slice(0,lim).map(o=>o.x.c.id);startExam(a,false)},
  examResume(){render()},
  exGo(el){S.exam.idx=Number(el.dataset.i);save();renderExam()},
  exPrev(){S.exam.idx=Math.max(0,S.exam.idx-1);save();renderExam()},
  exNext(){S.exam.idx=Math.min(S.exam.ids.length-1,S.exam.idx+1);save();renderExam()},
  exFlag(el){const E=S.exam;E.flag[E.ids[E.idx]]=el.checked;save();renderExam()},
  exFinish(){const E=S.exam;const blank=E.ids.filter(id=>!(E.resp[id]||'').trim()).length;if(blank&&!confirm(blank+' pergunta(s) em branco. Entregar mesmo assim?'))return;E.fase='correcao';E.idx=0;save();renderExam()},
  exMark(el){const E=S.exam;E.marks[E.ids[E.idx]]=el.dataset.m;save();if(E.idx<E.ids.length-1&&!E.ids.every(i=>E.marks[i]))E.idx++;renderExam()},
  exCancel(){if(confirm('Sair e descartar esta prova?')){S.exam=null;save();render()}},
  exDone(){
    const E=S.exam;if(!E.ids.every(id=>E.marks[id]))return;
    const res=[];let discs=new Set();
    E.ids.forEach(id=>{const f=findCard(id);const m=E.marks[id];discs.add(f.t.disc);const before=f.c.nivel;if(E.aplicar)applyMark(f.c,m);const n=nextState(Object.assign({},f.c,E.aplicar?{}:{}),m);res.push({t:f.t,c:f.c,m,before,after:E.aplicar?f.c.nivel:n.nv,prox:E.aplicar?f.c.prox:n.prox})});
    const min=Math.max(1,Math.round((Date.now()-E.inicio)/60000));
    if(E.aplicar)S.sessoes.push({id:uid(),data:today(),disc:discs.size===1?[...discs][0]:'Misto',min,tipo:'AR (revisão)',nota:''});
    const mainT=res[0].t;S.exam=null;save();render();
    const cnt=k=>res.filter(r=>r.m===k).length;
    openModal('<h2>Revisão concluída</h2><div class="row"><div class="kpi"><div class="l">Acertos</div><div class="v good">'+cnt('g')+'</div></div><div class="kpi"><div class="l">Parciais</div><div class="v warn">'+cnt('y')+'</div></div><div class="kpi"><div class="l">Erros</div><div class="v bad">'+(cnt('r')+cnt('x'))+'</div></div><div class="kpi"><div class="l">Tempo</div><div class="v">'+min+'min</div></div></div>'+(E.aplicar?'<p class="small muted">Próximas datas já agendadas e '+min+' min lançados em Horas.</p>':'<p class="small muted">Treino livre — agendamento não alterado.</p>')+
    '<div class="tw" style="max-height:260px"><table><tr><th>Assunto</th><th>Resultado</th><th>Próxima</th></tr>'+res.map(r=>'<tr><td>'+esc(r.t.assunto)+'<div class="small muted">'+esc(r.c.q.slice(0,60))+(r.c.q.length>60?'…':'')+'</div></td><td>'+({g:'🟢',y:'🟡',r:'🔴',x:'⚠'})[r.m]+' AR'+r.before+' → AR'+r.after+'</td><td>'+br(r.prox)+'</td></tr>').join('')+'</table></div><p class="small" style="margin-bottom:0">Método: depois da recuperação, faça algumas <b>questões objetivas</b> do assunto.</p><div class="mfoot"><button class="btn" data-act="closeModal">Fechar</button><button class="btn primary" data-act="postLog" data-id="'+mainT.id+'">Registrar questões objetivas</button></div>');
  },

const FS={h:null,state:'none',timer:null,busy:false,dirty:false,err:'',last:0};
const fsOK=()=>!!(window.showSaveFilePicker&&window.showOpenFilePicker&&window.indexedDB);
const FSTYPES=[{description:'Dados do Método Procuradoria (JSON)',accept:{'application/json':['.json']}}];
function idb(mode,fn){return new Promise((res,rej)=>{const r=indexedDB.open('mp-fs',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onerror=()=>rej(r.error);r.onsuccess=()=>{const tx=r.result.transaction('k',mode);const out=fn(tx.objectStore('k'));tx.oncomplete=()=>res(out&&out.result);tx.onerror=()=>rej(tx.error)}})}
function fsSchedule(){if(FS.state!=='ok')return;clearTimeout(FS.timer);FS.timer=setTimeout(fsWrite,600)}
async function fsWrite(){
  if(FS.state!=='ok'||!FS.h)return;
  if(FS.busy){FS.dirty=true;return}
  FS.busy=true;
  try{const w=await FS.h.createWritable();await w.write(JSON.stringify(S));await w.close();FS.last=Date.now();FS.err=''}
  catch(e){FS.state='need';FS.err=e.message||String(e);render()}
  finally{FS.busy=false}
  if(FS.dirty){FS.dirty=false;fsSchedule()}
}
async function fsSync(){
  try{
    const f=await FS.h.getFile();const txt=await f.text();let o=null;
    if(txt.trim()){try{o=JSON.parse(txt)}catch(e){FS.state='error';FS.err='O arquivo de dados está ilegível (não foi sobrescrito).';return}}
    if(o&&o.topics&&o.settings&&(o.savedAt||0)>(S.savedAt||0)){
      S=migrate(o);S.savedAt=o.savedAt;
      try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
      FS.state='ok';FS.err='';toast('Dados carregados do arquivo (versão mais recente)');
    }else{FS.state='ok';FS.err='';await fsWrite()}
  }catch(e){FS.state='need';FS.err=e.message||String(e)}
}
async function fsInit(){
  if(!fsOK()){FS.state='unsupported';render();return}
  try{FS.h=await idb('readonly',s=>s.get('h'))}catch(e){FS.h=null}
  if(!FS.h){FS.state='none';render();return}
  try{
    const p=await FS.h.queryPermission({mode:'readwrite'});
    if(p==='granted')await fsSync();else FS.state='need';
  }catch(e){FS.state='need';FS.err=e.message||String(e)}
  render();
}
Object.assign(ACT,{
  async fsCreate(){
    try{
      const h=await showSaveFilePicker({suggestedName:'metodo-procuradoria-dados.json',types:FSTYPES});
      FS.h=h;await idb('readwrite',s=>s.put(h,'h'));FS.state='ok';FS.err='';
      await fsWrite();render();toast('Salvamento automático ativado em '+h.name);
    }catch(e){if(e&&e.name!=='AbortError'){FS.err=e.message||String(e);render()}}
  },
  async fsOpen(){
    try{
      const [h]=await showOpenFilePicker({types:FSTYPES,multiple:false});
      const perm=await h.requestPermission({mode:'readwrite'});if(perm!=='granted'){toast('Permissão de gravação negada');return}
      const txt=await (await h.getFile()).text();let o=null;
      try{o=JSON.parse(txt)}catch(e){}
      if(!o||!o.topics||!o.settings){toast('Esse arquivo não é um arquivo de dados do app');return}
      if(!confirm('Carregar os dados deste arquivo e substituir os dados atuais deste navegador?'))return;
      S=migrate(o);S.savedAt=Math.max(o.savedAt||0,Date.now());
      FS.h=h;await idb('readwrite',s=>s.put(h,'h'));FS.state='ok';FS.err='';
      try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
      await fsWrite();render();toast('Arquivo conectado e dados carregados');
    }catch(e){if(e&&e.name!=='AbortError'){FS.err=e.message||String(e);render()}}
  },
  async fsReconnect(){
    try{
      const p=await FS.h.requestPermission({mode:'readwrite'});
      if(p!=='granted'){toast('Permissão negada — clique em Reconectar e escolha “Permitir”');return}
      await fsSync();render();
    }catch(e){FS.err=e.message||String(e);render()}
  },
  async fsUnlink(){
    if(!confirm('Parar de salvar neste arquivo? (os dados continuam no navegador e no arquivo atual)'))return;
    try{await idb('readwrite',s=>s.delete('h'))}catch(e){}
    FS.h=null;FS.state='none';render();
  }
});

/* ============ sincronização na nuvem (GitHub ou Google Drive) ============ */
const COLL=['topics','logs','erros','sessoes','simulados','treinos','leituras','eventos'];
let DEFMETA=null;
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)+s.length.toString(36)}
/* registra quando cada registro mudou e quais foram apagados (base da mesclagem) */
function track(){
  const now=Date.now();const M=S._m=S._m||{};const D=S._del=S._del||{};const seen=new Set(['__meta']);
  COLL.forEach(c=>{S[c]=S[c]||[];S[c].forEach(r=>{if(!r.id)r.id=uid();seen.add(r.id);const h=hash(JSON.stringify(r));if(!M[r.id]||M[r.id].h!==h)M[r.id]={u:now,h}})});
  if(DEFMETA===null){const f=fresh();DEFMETA=hash(JSON.stringify({settings:f.settings,disciplinas:f.disciplinas,checks:f.checks}))}
  const mh=hash(JSON.stringify({settings:S.settings,disciplinas:S.disciplinas,checks:S.checks}));
  if(!M.__meta||M.__meta.h!==mh)M.__meta={h:mh,u:mh===DEFMETA?0:now};
  Object.keys(M).forEach(id=>{if(!seen.has(id)){D[id]=now;delete M[id]}});
}
function cloudDoc(){track();const d={v:1,savedAt:S.savedAt||Date.now(),settings:S.settings,disciplinas:S.disciplinas,checks:S.checks,_m:S._m,_del:S._del};COLL.forEach(c=>d[c]=S[c]);return d}
function docSig(d){const m=d._m||{},x=d._del||{};return hash(JSON.stringify([Object.keys(m).sort().map(k=>[k,m[k].u,m[k].h]),Object.keys(x).sort().map(k=>[k,x[k]])]))}
function mergeDocs(L,R){
  const lm=L._m||{},rm=R._m||{},now=Date.now();
  const del={};[L._del||{},R._del||{}].forEach(o=>{for(const k in o)del[k]=Math.max(del[k]||0,o[k])});
  for(const k in del)if(now-del[k]>90*864e5)delete del[k];
  const out={v:1,savedAt:Math.max(L.savedAt||0,R.savedAt||0),_m:{}};
  const rWins=(au,ah,bu,bh)=>bu>au||(bu===au&&String(bh)>String(ah));
  COLL.forEach(c=>{
    const map=new Map();

    (R[c]||[]).forEach(r=>{const m=rm[r.id]||{u:0,h:''};const cur=map.get(r.id);if(!cur)map.set(r.id,{r,u:m.u,h:m.h});else if(cur.h!==m.h&&rWins(cur.u,cur.h,m.u,m.h))map.set(r.id,{r,u:m.u,h:m.h})});

  });

const ghOK=()=>!!(DR.gh.repo&&DR.gh.token);

function drStore(){try{localStorage.setItem(DRKEY,JSON.stringify({mode:DR.mode,cid:DR.cid,fileId:DR.fileId,email:DR.email,last:DR.last,gh:DR.gh}))}catch(e){}}
function drLoad(){

  }catch(e){}
  try{const t=JSON.parse(localStorage.getItem(DRTOK)||'null');if(t&&t.exp>Date.now()+60000){DR.token=t.t;DR.exp=t.exp}}catch(e){}

    if(m){const o=JSON.parse(atob(decodeURIComponent(m[1])));if(o.r&&o.t){DR.gh={repo:o.r,token:o.t};DR.mode='github';drStore()}history.replaceState(null,'',location.pathname+location.search)}
  }catch(e){}

const authErr=m=>Object.assign(new Error(m),{auth:true});

/* ---- Google Drive ---- */
function drLoadGis(){return new Promise((res,rej)=>{
  if(window.google&&google.accounts&&google.accounts.oauth2)return res();
  const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=()=>res();s.onerror=()=>rej(new Error('offline'));document.head.appendChild(s);
})}
function drToken(interactive){
  return new Promise((res,rej)=>{
    if(DR.token&&Date.now()<DR.exp-60000)return res(DR.token);
    drLoadGis().then(()=>{
      let done=false,to=0;const fin=(f,v)=>{if(!done){done=true;clearTimeout(to);f(v)}};
      to=setTimeout(()=>fin(rej,authErr('timeout')),interactive?120000:15000);
      const tc=google.accounts.oauth2.initTokenClient({client_id:DR.cid,scope:'https://www.googleapis.com/auth/drive.appdata',
        callback:r=>{if(r.error)return fin(rej,authErr(r.error));DR.token=r.access_token;DR.exp=Date.now()+(Number(r.expires_in)||3600)*1000;try{localStorage.setItem(DRTOK,JSON.stringify({t:DR.token,exp:DR.exp}))}catch(e){}fin(res,DR.token)},
        error_callback:e=>fin(rej,authErr((e&&e.type)||'popup'))});
      const o={prompt:interactive?'':'none'};if(DR.email)o.hint=DR.email;
      tc.requestAccessToken(o);
    },rej);
  });
}
async function drFetch(url,opt){
  opt=opt||{};const t=await drToken(false);opt.headers=Object.assign({},opt.headers,{Authorization:'Bearer '+t});
  let r=await fetch(url,opt);
  if(r.status===401){DR.token=null;try{localStorage.removeItem(DRTOK)}catch(e){}opt.headers.Authorization='Bearer '+await drToken(false);r=await fetch(url,opt)}
  if(!r.ok){let d='';try{d=(await r.text()).slice(0,160)}catch(e){}const e=new Error('Drive '+r.status+(d?': '+d:''));e.status=r.status;if(r.status===401)e.auth=true;throw e}
  return r;
}
const GA='https://www.googleapis.com/';
async function drFind(){
  if(DR.fileId){try{await drFetch(GA+'drive/v3/files/'+DR.fileId+'?fields=id');return DR.fileId}catch(e){if(e.status!==404)throw e;DR.fileId=''}}
  const q=encodeURIComponent("name='metodo-procuradoria.json' and 'appDataFolder' in parents and trashed=false");
  const r=await(await drFetch(GA+'drive/v3/files?spaces=appDataFolder&q='+q+'&fields=files(id,modifiedTime)&orderBy='+encodeURIComponent('modifiedTime desc'))).json();
  return r.files&&r.files.length?r.files[0].id:'';
}
async function drCreate(doc){
  const b='mpb'+uid();
  const body='--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name:'metodo-procuradoria.json',parents:['appDataFolder']})+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(doc)+'\r\n--'+b+'--';
  const r=await drFetch(GA+'upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body});
  return (await r.json()).id;
}
const BKD={
  async auth(interactive){
    await drToken(interactive);
    if(!DR.email){try{const j=await(await drFetch(GA+'drive/v3/about?fields=user(emailAddress)')).json();DR.email=(j.user&&j.user.emailAddress)||'';drStore()}catch(e){}}
  },
  async pull(){const id=await drFind();if(!id)return{remote:null,ver:''};DR.fileId=id;return{remote:await(await drFetch(GA+'drive/v3/files/'+id+'?alt=media')).json(),ver:id}},
  async push(doc,ver){
    if(ver)await drFetch(GA+'upload/drive/v3/files/'+ver+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(doc)});

/* ---- GitHub (repositório privado + token; não pede login) ---- */
function ghErr(s,t){
  if(s===401)return authErr('Token do GitHub inválido ou expirado');
  if(s===403)return new Error('GitHub recusou (403): confira se o token tem “Contents: Read and write” neste repositório'+(/rate limit/i.test(t||'')?' (limite de uso — tente mais tarde)':''));
  if(s===404)return new Error('Repositório não encontrado — confira o nome (usuario/repositorio) e se o token tem acesso a ele');
  return new Error('GitHub '+s+(t?': '+String(t).slice(0,120):''));
}
const ghH=extra=>Object.assign({Authorization:'Bearer '+DR.gh.token,Accept:'application/vnd.github+json'},extra||{});
const ghU=()=>'https://api.github.com/repos/'+DR.gh.repo+'/contents/'+GHPATH;
const b64enc=s=>{const b=new TextEncoder().encode(s);let o='';for(let i=0;i<b.length;i+=0x8000)o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(o)};
const b64dec=s=>{const o=atob(String(s).replace(/\s/g,''));const b=new Uint8Array(o.length);for(let i=0;i<o.length;i++)b[i]=o.charCodeAt(i);return new TextDecoder().decode(b)};
const BKG={
  async auth(){if(!ghOK())throw authErr('Token do GitHub não configurado')},
  async pull(){
    const r=await fetch(ghU(),{headers:ghH(),cache:'no-store'});
    if(r.status===404){const rr=await fetch('https://api.github.com/repos/'+DR.gh.repo,{headers:ghH(),cache:'no-store'});if(rr.ok)return{remote:null,ver:''};throw ghErr(rr.status===404?404:rr.status)}
    if(!r.ok)throw ghErr(r.status,await r.text());
    const j=await r.json();let txt;
    if(j.content&&j.encoding==='base64')txt=b64dec(j.content);
    else{const rw=await fetch(ghU(),{headers:ghH({Accept:'application/vnd.github.raw+json'}),cache:'no-store'});if(!rw.ok)throw ghErr(rw.status);txt=await rw.text()}
    return{remote:JSON.parse(txt),ver:j.sha};
  },
  async push(doc,ver){
    const body={message:'sync '+new Date().toISOString(),content:b64enc(JSON.stringify(doc))};if(ver)body.sha=ver;
    const r=await fetch(ghU(),{method:'PUT',headers:ghH({'Content-Type':'application/json'}),body:JSON.stringify(body)});
    if(r.status===409||r.status===422){throw Object.assign(new Error('conflito de versão'),{conflict:true})}
    if(!r.ok)throw ghErr(r.status,await r.text());
  }
};

/* ---- núcleo: puxa, mescla, aplica e envia ---- */
function applyMerged(m){
  const keep={timer:S.timer,exam:S.exam,lastBackup:S.lastBackup};
  S=migrate(Object.assign({},m,keep));S.savedAt=Date.now();
  DR.applying=true;try{save()}finally{DR.applying=false}
  if(!S.exam&&!$('#modal').classList.contains('on'))render();
}
async function driveSync(interactive){
  if(!drReady()||!drOriginOK())return;
  if(DR.busy){DR.pending=true;return}
  DR.busy=true;DR.state='sync';DR.err='';drChip();
  try{
    const bk=DR.mode==='github'?BKG:BKD;
    await bk.auth(interactive);
    for(let tries=0;;tries++){
      const{remote,ver}=await bk.pull();
      if(remote&&!(Array.isArray(remote.topics)&&remote._m))throw new Error('O arquivo na nuvem está em formato inesperado (não foi alterado).');
      const local=cloudDoc();
      try{
        if(!remote)await bk.push(local,'');
        else{
          const merged=mergeDocs(local,remote);const sm=docSig(merged);
          if(sm!==docSig(local))applyMerged(merged);
          if(sm!==docSig(remote))await bk.push(cloudDoc(),ver);
        }
        break;
      }catch(e){if(e.conflict&&tries<3)continue;throw e}
    }
    DR.state='ok';DR.last=Date.now();drStore();
  }catch(e){
    DR.err=e.message||String(e);
    DR.state=e.auth?'need':(e instanceof TypeError||e.message==='offline'||!navigator.onLine)?'offline':'error';
    if(interactive&&DR.state==='need'&&DR.mode==='drive')toast('Não foi possível entrar no Google ('+DR.err+')');
  }finally{
    DR.busy=false;drChip();
    if(UI.view==='config'&&!$('#modal').classList.contains('on')&&!S.exam)render();
    if(DR.pending){DR.pending=false;driveSchedule()}
  }
}
function driveSchedule(){
  if(!drReady()||DR.applying||!drOriginOK()||DR.state==='off'||DR.state==='need')return;
  clearTimeout(DR.timer);DR.timer=setTimeout(()=>driveSync(false),4000);
}

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&DR.state==='ok'&&Date.now()-DR.last>30000)driveSync(false)});
window.addEventListener('online',()=>{if(drReady()&&DR.state==='offline')driveSync(false)});

function applyTheme(){const t=S.settings.tema;document.documentElement.dataset.theme=t==='auto'?(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t}
function render(){
  const fa=document.activeElement,fid=fa&&fa.id,pos=fa&&fa.selectionStart;
  const nd=dueCards().length;
  $('#nav').innerHTML=Object.entries(VIEWS).map(([k,v])=>'<a data-act="nav" data-v="'+k+'" class="'+(UI.view===k?'on':'')+'">'+v.i+' '+v.t+(k==='hoje'&&nd?'<span class="nb">'+nd+'</span>':'')+'</a>').join('');
  $('#title').textContent=VIEWS[UI.view].t;
  $('#main').innerHTML=fsBanner()+VIEWS[UI.view].r();
  $('#timerChip').innerHTML=S.timer?'<span class="badge r">● <span class="tc">'+fmtHMS(Date.now()-S.timer.start)+'</span> '+esc(S.timer.disc)+'</span>':'';
  drChip();
  if(fid){const n=document.getElementById(fid);if(n){n.focus();try{if(pos!=null)n.setSelectionRange(pos,pos)}catch(e){}}}
  renderExam();
}
applyTheme();render();fsInit().then(driveInit,driveInit);
if(drOriginOK()){try{const l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.appendChild(l);if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
</script>
</body>
</html>
